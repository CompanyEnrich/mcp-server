name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CompanyEnrich/mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install package managers
        run: npm install --global npm@11.12.1 pnpm@11.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: npm run type-check

      - name: Build and inspect the package
        run: npm pack --dry-run

      - name: Check whether this version needs publishing
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== '@companyenrich/mcp' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('This workflow publishes stable @companyenrich/mcp versions only.');
          }

          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {
            headers: { 'cache-control': 'no-cache' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) {
            throw new Error(`Cannot check npm releases: HTTP ${response.status}. Publishing stopped.`);
          }
          const metadata = await response.json();
          const exists = Object.hasOwn(metadata.versions ?? {}, version);
          const latest = metadata['dist-tags']?.latest;

          if (!exists && latest) {
            if (!/^\d+\.\d+\.\d+$/.test(latest)) {
              throw new Error(`Cannot compare latest version ${latest}. Check npm's latest tag.`);
            }
            const previous = latest.split('.').map(Number);
            const difference = version.split('.').map(Number)
              .map((part, index) => part - previous[index]).find((part) => part !== 0) ?? 0;
            if (difference <= 0) {
              throw new Error(`Version ${version} must be newer than npm's latest version ${latest}.`);
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!exists}\n`);
          const message = exists
            ? `${name}@${version} is already published. Build passed; publishing skipped.`
            : `${name}@${version} is ready to publish.`;
          console.log(message);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          NODE

      - name: Publish using npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        # npm creates an OIDC credential for this workflow; no NPM_TOKEN is needed.
        # Do not force provenance: this GitHub repository is private.
        run: npm publish --access public --tag latest
